<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>마케팅 정보 수신 동의</title>
  <style>
    body { font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif; line-height: 1.6; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { font-size: 1.5rem; }
    h2 { font-size: 1.1rem; margin-top: 1.5rem; }
    .note { background: #f5f5f5; padding: .75rem 1rem; border-radius: 8px; font-size: .9rem; }
  </style>
</head>
<body>
  <p class="note">로컬/개발용 초안입니다. 선택 동의 항목입니다.</p>
  <h1>마케팅 정보 수신 동의 (선택)</h1>
  <p>PlanWith는 이벤트, 혜택, 신규 기능 안내 등 마케팅 정보를 이메일 등으로 발송할 수 있습니다.</p>

  <h2>수신 항목 예시</h2>
  <ul>
    <li>프로모션·이벤트 안내</li>
    <li>신규 서비스/기능 소개</li>
    <li>맞춤형 혜택 정보</li>
  </ul>

  <h2>철회</h2>
  <p>본 동의는 선택 사항이며, 동의하지 않아도 서비스 이용이 가능합니다. 동의 후에도 설정 또는 고객센터를 통해 언제든지 수신을 거부할 수 있습니다.</p>
</body>
</html>
